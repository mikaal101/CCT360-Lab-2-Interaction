<!DOCTYPE html>
<html>
    <head>
        <title>CCT360 Lab 2</title>
        <style>
            .navbar {
                background: linear-gradient(to bottom right, lightgreen, beige);
                border-radius: 50px;
                box-shadow: 5px 5px 10px black;
                padding: 20px;
                margin: 50px;
                text-align: center;
            }

            .cards {
                display: flex;
                align-items: center;
                margin: 30px;
            }

            .card {
                margin: 30px;
                display: flex;
                align-items: center;
                background-color: beige;
                border: 1px black;
                border-radius: 32px;
                padding: 30px;
            }

            .butt {
                padding: 10px;
                text-align: center;
                background-color: lightgreen;
                border-radius: 25%;
                border: 1px lightgrey;
                box-shadow: 1px 1px 2px black;
            }

        </style>
    </head>
    <body>
        <div class="navbar">
            <h1>CCT360 Lab - 3 Interactions</h1>
        </div>
        <section class="cards">
            <div class="card" id="corner">
                <h2>This button changes the corner radius of this card!</h2>
                <button class="butt">Change</button>
            </div>
            <div class="card" id="grad-and-font">
                <h2>This button changes the gradient of this card and the font!</h2>
                <button class="butt">Change</button>
            </div>
            <div class="card" id="popup">
                <h2>This button will show a pop up message!</h2>
                <button class="butt">Change</button>
            </div>
        </section>
    </body>
</html>
