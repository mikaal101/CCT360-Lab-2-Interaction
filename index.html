<!DOCTYPE html>
<html>
    <head>
        <title>CCT360 Lab 2</title>
        <style>

            * {
                font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            }
            .navbar {
                background: linear-gradient(to bottom right, rgb(184, 240, 184), beige);
                border-radius: 50px;
                box-shadow: 5px 5px 10px grey;
                padding: 20px;
                margin: 50px;
                text-align: center;
            }

            .cards {
                display: flex;
                align-items: center;
                margin: 30px;
            }

            .card {
                margin: 30px;
                display: flex;
                align-items: center;
                background-color: beige;
                border: 1px black;
                border-radius: 32px;
                padding: 30px;
                box-shadow: 2px 2px 4px grey;
            }

            .butt {
                padding: 10px;
                text-align: center;
                background-color: rgb(184, 240, 184);
                border-radius: 25%;
                border: 1px lightgrey;
                box-shadow: 1px 1px 2px black;
                margin-left: 20px;
                margin-top: 50px;
                margin-bottom: 50px;
                font-size: 16px;
            }

            .butt:hover {
                box-shadow: 1px 1px 4px black;
                background-color: lightgreen;
            }

            .card:hover {
                box-shadow: 2px 2px 5px rgb(81, 81, 81);
            }

        </style>
    </head>
    <body>
        <div class="navbar">
            <h1>CCT360 Lab - 3 Interactions</h1>
        </div>
        <section class="cards">
            <div class="card" id="corner">
                <h2 id="card1text">This button changes the corner radius of this card!</h2>
                <button onclick="cornerfunction()" class="butt">Press</button>
            </div>
            <div class="card" id="backcolor">
                <h2 id="card2text">This button changes the background color of this card and the font!</h2>
                <button onclick="gradfontFunction()" class="butt">Press</button>
            </div>
            <div class="card" id="removecard">
                <h2 id="card3text">This button will remove this card!</h2>
                <button onclick="confirmFunction()" class="butt">Press</button>
            </div>
        </section>
        <script>
            function cornerfunction() {
                document.getElementById("corner").style.borderRadius = "0px";
                document.getElementById("card1text").innerHTML = "Now the corner radius is 0!";
            }

            function gradfontFunction() {
                document.getElementById("backcolor").style.backgroundColor = "white";
                document.getElementById("card2text").style.fontFamily = "'Courier New', Courier, monospace";
                document.getElementById("card2text").innerHTML = "Great! Now the color and font is changed.";
            }

            function confirmFunction() {
                let x = window.confirm("Are you sure you want to remove this card?");
                if (x) {
                    let card3 = document.getElementById("removecard").style;
                    card3.backgroundColor = "white";
                    card3.border = "0px white";
                    card3.boxShadow = "0px 0px 0px white";
                    document.getElementById("card3text").innerHTML = "Oh no! this text and the button is not on a card anymore!"
                }
            }
        </script>
    </body>
</html>
